<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game: Rắn Săn Mồi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            background-color: #111;
            display: block;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #game-over-screen.show {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h2 {
            font-size: 3rem;
            color: #ff4757;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background-color: #2ed573;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            background-color: #26af5f;
            transform: scale(1.05);
        }
        #controls-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #ddd;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>RẮN SĂN MỒI</h1>
    <div id="score-board">Điểm số: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <button onclick="resetGame()">Chơi Lại</button>
        </div>
    </div>

    <div id="controls-hint">Sử dụng các phím mũi tên <b>↑ ↓ ← →</b> hoặc <b>W A S D</b> để di chuyển</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gameOverScreen = document.getElementById("game-over-screen");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        const gameSpeed = 100; // Tốc độ game (mili giây), số càng nhỏ rắn chạy càng nhanh

        // Bắt đầu game
        function startGame() {
            generateFood();
            gameInterval = setInterval(update, gameSpeed);
        }

        // Vòng lặp cập nhật trạng thái game
        function update() {
            moveSnake();
            
            if (checkCollision()) {
                endGame();
                return;
            }

            checkFoodEat();
            draw();
        }

        // Vẽ mọi thứ lên canvas
        function draw() {
            // Xóa nền cũ
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới mờ
            ctx.strokeStyle = "#222";
            for(let i=0; i<tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Vẽ rắn
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#2ed573" : "#7bed9f"; // Đầu xanh đậm, thân xanh nhạt
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Vẽ mồi
            ctx.fillStyle = "#ff4757"; // Mồi màu đỏ
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff4757";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0; // Tắt shadow để không lỗi hình khác
        }

        // Di chuyển rắn
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            snake.pop();
        }

        // Kiểm tra va chạm (Tường hoặc Thân)
        function checkCollision() {
            const head = snake[0];
            
            // Đụng tường
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // Đụng thân
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Kiểm tra ăn mồi
        function checkFoodEat() {
            const head = snake[0];
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                
                // Thêm một đốt thân bằng cách nhân bản đốt cuối cùng
                snake.push({ ...snake[snake.length - 1] });
                generateFood();
            }
        }

        // Tạo mồi ngẫu nhiên không trùng thân rắn
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Nếu mồi đè lên rắn thì tạo lại
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        // Xử lý nút bấm điều khiển
        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                case "w":
                case "W":
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case "ArrowDown":
                case "s":
                case "S":
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                case "a":
                case "A":
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                case "d":
                case "D":
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });

        // Kết thúc game
        function endGame() {
            clearInterval(gameInterval);
            gameOverScreen.classList.add("show");
        }

        // Reset game để chơi lại
        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOverScreen.classList.remove("show");
            generateFood();
            gameInterval = setInterval(update, gameSpeed);
        }

        // Chạy game lần đầu
        startGame();
    </script>
</body>
</html>
